<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Funcionários</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <h1 class="mb-4 text-center">Gestão de Funcionários</h1>

    <!-- Formulário -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header fw-bold">Cadastro de Funcionários</div>
      <div class="card-body">
        <form id="form-funcionario">
          <div class="row g-3">
            <div class="col-md-4">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" id="nome" class="form-control">
            </div>
            <div class="col-md-2">
              <label for="idade" class="form-label">Idade</label>
              <input type="number" id="idade" class="form-control" min="0">
            </div>
            <div class="col-md-3">
              <label for="cargo" class="form-label">Cargo</label>
              <input type="text" id="cargo" class="form-control">
            </div>
            <div class="col-md-3">
              <label for="salario" class="form-label">Salário (R$)</label>
              <input type="number" id="salario" class="form-control" min="0" step="0.01">
            </div>
          </div>

          <div class="mt-3">
            <button type="button" id="btn-cadastrar" class="btn btn-primary">Cadastrar</button>
            <button type="button" id="btn-cancelar" class="btn btn-secondary">Cancelar edição</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
      <div class="card-header fw-bold">Funcionários Cadastrados</div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cargo</th>
                <th>Salário</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="corpo-tabela"></tbody>
          </table>
        </div>
      </div>
    </div>

        <!-- Relatórios -->
    <div class="card mt-4 shadow-sm">
      <div class="card-header fw-bold">Relatórios</div>
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 mb-3">
          <button type="button" id="btn-salario-alto" class="btn btn-success">Salário maior que R$ 5.000</button>
          <button type="button" id="btn-media-salarial" class="btn btn-info">Média salarial</button>
          <button type="button" id="btn-cargos-unicos" class="btn btn-outline-primary">Cargos únicos</button>
          <button type="button" id="btn-nomes-maiusculo" class="btn btn-outline-primary">Nomes em maiúsculo</button>
        </div>
    <div id="resultado" class="alert alert-secondary mb-0">Nenhum relatório gerado.</div>
  </div>
</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
